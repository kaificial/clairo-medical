<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Clairo: your medical report, in plain language">
<style>
  svg {
    --bg: #f8f2e1; --card: #fdf8eb; --fg: #38352c; --muted: #6f6958; --border: #e2dbc7;
    --secondary: #e8e1cd; --primary: #eaec53; --on-primary: #38352c; --highlight: #f9f198; --on-hl: #312e24;
    --success: #688838; --caution: #a96000; --lines: #9f9572; --track: #f0e9d6;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #110f0a; --card: #1c1913; --fg: #e9e6dd; --muted: #a49e8f; --border: #312d26;
      --secondary: #2c2821; --primary: #e5e75b; --on-primary: #19160e; --highlight: #ece277; --on-hl: #231f14;
      --success: #8fb35e; --caution: #eaa950; --lines: #726b5b; --track: #24211b;
    }
  }
  .bg { fill: var(--bg); }
  .card { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
  .soft { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
  .fg { fill: var(--fg); }
  .muted { fill: var(--muted); }
  .primary { fill: var(--primary); }
  .on-primary { fill: var(--on-primary); }
  .hl { fill: var(--highlight); }
  .on-hl { fill: var(--on-hl); }
  .serif { font-family: Newsreader, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; }
  .sans { font-family: Geist, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .lines { stroke: var(--lines); fill: none; }
  .border { stroke: var(--border); }
  .track { fill: var(--track); }
  .success { fill: var(--success); }
  .caution { fill: var(--caution); }
  .arrow { stroke: var(--muted); stroke-width: 1.75; fill: none; }
  .dash { stroke: var(--lines); stroke-width: 1.5; stroke-dasharray: 6 6; fill: none; }
</style>
<defs>
  <clipPath id="frame"><rect x="1" y="1" width="1278" height="438" rx="28"/></clipPath>
  <radialGradient id="fade" cx="0.78" cy="0.5" r="0.62">
    <stop offset="0" stop-color="white"/><stop offset="0.55" stop-color="white"/><stop offset="1" stop-color="black"/>
  </radialGradient>
  <mask id="fade-mask"><rect width="1280" height="440" fill="url(#fade)"/></mask>
</defs>
<rect x="1" y="1" width="1278" height="438" rx="28" class="bg" stroke="var(--border)" stroke-width="2"/>
<g clip-path="url(#frame)">
  <g class="lines" stroke-width="1.2" mask="url(#fade-mask)"><g transform="rotate(0 1010 220)" stroke-opacity="0.60">
      <circle cx="1010" cy="185" r="35"/><circle cx="1045" cy="220" r="35"/>
      <circle cx="1010" cy="255" r="35"/><circle cx="975" cy="220" r="35"/></g><g transform="rotate(17 1010 220)" stroke-opacity="0.56">
